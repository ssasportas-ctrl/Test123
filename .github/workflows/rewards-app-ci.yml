name: rewards-app CI

on:
  push:
    branches: [main]
    paths:
      - 'new site/rewards-app/**'
      - '.github/workflows/rewards-app-ci.yml'
  pull_request:
    paths:
      - 'new site/rewards-app/**'
      - '.github/workflows/rewards-app-ci.yml'

defaults:
  run:
    working-directory: new site/rewards-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 'new site/rewards-app/package-lock.json'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
